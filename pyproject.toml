[project]
name = "better-captions"
version = "0.1.0"
description = "Speaker-aware transcription and captioning for DaVinci Resolve"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "faster-whisper>=1.1",
    "sherpa-onnx>=1.10",
    "numpy>=1.24",
    "soundfile>=0.12",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]

[project.scripts]
better-captions = "better_captions.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/better_captions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["resolve_plugin/src", "."]
